name: Release

# Per-OS matrix: each runner natively builds + publishes its own RID (the only reliable way to cover
# Windows-MSVC, which doesn't cross-compile cleanly from other hosts). Produces self-contained,
# non-trimmed editor bundles with the native libzigote and subset fonts.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install font subsetter (pyftsubset)
        run: python -m pip install --upgrade fonttools

      - name: Publish
        shell: bash
        env:
          FONT_SUBSET_TOOL: pyftsubset
        run: build/publish.sh ${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigote-editor-${{ matrix.rid }}
          path: artifacts/zigote-editor-${{ matrix.rid }}.zip
          if-no-files-found: error
