<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zigote</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #ddd; font: 14px system-ui, sans-serif; }
        /* SDL sizes the canvas backing store; CSS fills the page with it. */
        #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
        #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>
    <script type="module" src="main.js"></script>
</body>
</html>
